[project]
name = "documind"
version = "0.1.0"
description = "Question answering over technical PDFs with code-verified citations and quantitative RAG evaluation"
readme = "README.md"
authors = [{ name = "Gabriel Ermenegildo" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Code blocks in docs are interface sketches, not code under lint.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, UP: modern syntax,
# B: likely bugs, SIM: simplifications, ANN: type hints are mandatory.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["integration: needs a running Postgres (make up)"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
