[alembic]
script_location = %(here)s/alembic
path_separator = os

# Readable file names: 0001_initial_schema.py instead of a random hash prefix.
file_template = %%(rev)s_%%(slug)s

# No database URL and no logging sections here on purpose:
# alembic/env.py takes both from the application (documind.config, documind.logging_config).
